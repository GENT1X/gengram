name: gengram
description: GenGram, неофициальный клиент Telegram с режимом призрака.
publish_to: "none"
version: 0.7.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.3
  record: ^6.0.0
  shared_preferences: ^2.2.3
  window_manager: ^0.5.1
  tray_manager: ^0.8.0
  flutter_foreground_task: ^11.0.0
  lottie: ^3.1.2
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  media_kit: ^1.1.11
  flutter_local_notifications: ^19.0.0
  app_badge_plus: ^1.1.5
  visibility_detector: ^0.4.0+2
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/tray.png
